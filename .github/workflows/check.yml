name: Svitlo check
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Надіслати поточний графік (1 — так, 0 — ні)"
        default: "1"
        required: false
      kino:
        description: "Службове"
        default: ""
        required: false
      yt:
        description: "Службове"
        default: ""
        required: false
permissions:
  contents: write
concurrency:
  group: svitlo
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Install Pillow
        run: pip install -q pillow
      - name: Run bot
        run: python3 check.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP: ${{ secrets.GROUP }}
          WIFE_ID: ${{ secrets.WIFE_ID }}
          WIFE_NAME: ${{ secrets.WIFE_NAME }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          TRAKT_ID: ${{ secrets.TRAKT_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          REDDIT_ID: ${{ secrets.REDDIT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          SILPO_BRANCH: ${{ secrets.SILPO_BRANCH }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          REQ_KINO: ${{ inputs.kino }}
          REQ_YT: ${{ inputs.yt }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send != '0' && '1' || '' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add state.json
          [ -f silpo_prices.json ] && git add silpo_prices.json
          [ -f fact.png ] && git add fact.png
          [ -f quiz_pool.json ] && git add quiz_pool.json
          git diff --cached --quiet && exit 0
          git commit -m "state"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          echo "Не вдалося зберегти state.json"; exit 1
