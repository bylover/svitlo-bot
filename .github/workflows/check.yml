name: Svitlo check
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Надіслати поточний графік (1 — так, 0 — ні)"
        default: "1"
        required: false
      kino:
        description: "Службове"
        default: ""
        required: false
      yt:
        description: "Службове"
        default: ""
        required: false
permissions:
  contents: write
concurrency:
  group: svitlo-${{ github.event_name == 'schedule' && 'cron' || 'bot' }}   # розклад і запуски бота — окремі черги: не скасовують одне одного
  cancel-in-progress: false
jobs:
  guard:                                    # запуск за розкладом — лише запасний: якщо бот запускав перевірку за останні 15 хв, тихо пропускаємо
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "check.yml" --limit 20 --json event,createdAt,status \
              --jq '[.[] | select(.event=="workflow_dispatch") | select((now - (.createdAt|fromdateiso8601)) < 900)] | length' 2>/dev/null || echo 0)
          echo "Запусків від бота за 15 хв: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Pillow
        run: pip install -q pillow
      - name: Run bot
        run: python3 check.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP: ${{ secrets.GROUP }}
          WIFE_ID: ${{ secrets.WIFE_ID }}
          WIFE_NAME: ${{ secrets.WIFE_NAME }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          TRAKT_ID: ${{ secrets.TRAKT_ID }}
          TPDB_KEY: ${{ secrets.TPDB_KEY }}
          STASHDB_KEY: ${{ secrets.STASHDB_KEY }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_BG: ${{ secrets.GEMINI_KEY_BG }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          REDDIT_ID: ${{ secrets.REDDIT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USER: ${{ secrets.REDDIT_USER }}
          REDDIT_PASS: ${{ secrets.REDDIT_PASS }}
          SILPO_BRANCH: ${{ secrets.SILPO_BRANCH }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          REQ_KINO: ${{ inputs.kino }}
          REQ_YT: ${{ inputs.yt }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send != '0' && '1' || '' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add state.json
          [ -f silpo_prices.json ] && git add silpo_prices.json
          [ -f fact.png ] && git add fact.png
          [ -f quiz_pool.json ] && git add quiz_pool.json
          [ -d silpo ] && git add silpo
          [ -f sexed.json ] && git add sexed.json
          [ -f impulse.json ] && git add impulse.json
          [ -f music.json ] && git add music.json
          [ -f health.json ] && git add health.json
          [ -f cofid.json ] && git add cofid.json
          [ -f games.json ] && git add games.json
          [ -f audiobooks.json ] && git add audiobooks.json
          [ -f match.json ] && git add match.json
          [ -f recipes.json ] && git add recipes.json
          [ -f prom.json ] && git add prom.json
          [ -f en_live.json ] && git add en_live.json
          [ -f sb_stats.json ] && git add sb_stats.json
          [ -d sx ] && git add sx
          git diff --cached --quiet && exit 0
          git commit -m "state"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            sleep 5
          done
          echo "::warning::Не вдалося зберегти state.json (паралельний запуск) — збережеться наступного разу"; exit 0
