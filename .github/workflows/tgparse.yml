name: TG video parser
on:
  schedule:
    - cron: "40 7,19 * * *"         # лише запасний (09:40 і 21:40 за Києвом): основні запуски — від бота о 08:12–12:12, 18:12, 22:12 (розклад GitHub ненадійний)
  workflow_dispatch:
concurrency:
  group: tg-parser
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: pip install -q telethon
      - name: Collect videos
        run: python3 -u tg_parser.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
