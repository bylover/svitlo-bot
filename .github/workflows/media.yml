name: Media for Instagram
on:
  workflow_dispatch:
    inputs:
      chat: { description: "chat id", required: true }
      file_id: { description: "Telegram file_id", required: true }
      ar: { description: "4:5 | 9:16 | 1:1 | 3:4", required: false, default: "4:5" }
      crop: { description: "top | center | bottom", required: false, default: "center" }
      kind: { description: "photo | video", required: false, default: "photo" }
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -q pillow pillow-heif
      - name: Process
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT: ${{ inputs.chat }}
          FILE_ID: ${{ inputs.file_id }}
          AR: ${{ inputs.ar }}
          CROP: ${{ inputs.crop }}
          KIND: ${{ inputs.kind }}
        run: python media.py
